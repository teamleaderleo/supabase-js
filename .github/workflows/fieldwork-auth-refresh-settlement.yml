name: Fieldwork auth refresh settlement

on:
  workflow_dispatch:
  push:
    branches:
      - fieldwork/auth-refresh-settlement-lab
    paths:
      - '.fieldwork/auth-refresh-settlement/**'
      - '.github/workflows/fieldwork-auth-refresh-settlement.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.fieldwork/auth-refresh-settlement/**'
      - '.github/workflows/fieldwork-auth-refresh-settlement.yml'

concurrency:
  group: fieldwork-auth-refresh-settlement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-refresh-settlement:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant:
          - early-shared-settlement
          - token-aware-committed-result

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check experiment runner
        run: bash -n .fieldwork/auth-refresh-settlement/run.sh

      - name: Verify executable model result
        run: |
          node .fieldwork/auth-refresh-settlement/settlement-model.mjs > /tmp/settlement-model.result.json
          diff -u \
            .fieldwork/auth-refresh-settlement/settlement-model.result.json \
            /tmp/settlement-model.result.json

      - name: Run real auth-js regression matrix
        run: bash .fieldwork/auth-refresh-settlement/run.sh "${{ matrix.variant }}"
